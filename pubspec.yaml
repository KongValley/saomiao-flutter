name: saomiao_flutter
description: "扫描件工坊 · Flutter 跨平台本地文档扫描器"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image: ^4.13.1
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  file_picker: ^13.4.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/splash-icon.png
    - assets/logo.png
